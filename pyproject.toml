[project]
name = "mcp-allquiet"
version = "0.1.0"
description = "MCP server for the All Quiet incident management API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "iagogfe", email = "82007235+iagogfe@users.noreply.github.com" }
]
keywords = ["mcp", "allquiet", "incident-management", "on-call", "sre"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
requires-python = ">=3.10"
dependencies = [
    "httpx2>=2.13.0",
    "mcp==2.2.*",
]

[project.scripts]
mcp-allquiet = "mcp_allquiet:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "ty>=0.0.81",
]
